name: Deploy Vite app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/404.html
          test -d dist/assets

          if grep -R --line-number --fixed-strings "/sf2/" dist; then
            echo "ERROR: stale /sf2/ base path found in the production artifact."
            exit 1
          fi

          asset_count="$(find dist/assets -type f | wc -l)"
          if [ "$asset_count" -lt 1 ]; then
            echo "ERROR: Vite produced no assets."
            exit 1
          fi

          echo "Validated GitHub Pages artifact with $asset_count asset file(s)."

      - name: Add GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Re-validate SPA fallback
        run: cmp -s dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
