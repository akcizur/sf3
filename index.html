<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Considered goods for a quieter home." />
    <meta property="og:title" content="Maison Terre" />
    <meta property="og:description" content="Considered goods for a quieter home." />
    <meta property="og:type" content="website" />
    <title>Maison Terre</title>
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("maison-terre-theme");
          const theme = stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
